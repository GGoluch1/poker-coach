<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e12" />
    <script>
      // Apply the saved theme before the first paint so the page doesn't flash.
      try {
        if (localStorage.getItem('poker-coach:theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#f6f6f3'
        }
      } catch {
        // Storage blocked: stay dark.
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Poker Coach</title>
    <meta
      name="description"
      content="Learn no-limit hold'em by playing against bots with a live coach, focused drills, hand history reviews, preflop charts and a river solver."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
